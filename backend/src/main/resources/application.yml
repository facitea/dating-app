spring:
  config:
    import: optional:file:.local/push.properties,optional:file:.local/firebase.properties,optional:file:.local/admin.properties
  datasource:
    url: ${DB_URL:jdbc:mariadb://127.0.0.1:3306/dating_db}
    username: ${DB_USERNAME:dating_user}
    password: ${DB_PASSWORD:dating_password}
    driver-class-name: org.mariadb.jdbc.Driver
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_FILE_SIZE:10MB}
      max-request-size: ${MAX_UPLOAD_REQUEST_SIZE:12MB}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
app:
  firebase:
    project-id: ${FIREBASE_PROJECT_ID:}
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: 3600000
  admin:
    bootstrap-username: ${ADMIN_BOOTSTRAP_USERNAME:}
    bootstrap-password: ${ADMIN_BOOTSTRAP_PASSWORD:}
  upload:
    dir: uploads
  auth:
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:false}
    refresh-cookie-max-age-seconds: ${REFRESH_COOKIE_MAX_AGE_SECONDS:1209600}
  phone-auth:
    expose-dev-code: ${PHONE_AUTH_EXPOSE_DEV_CODE:false}
